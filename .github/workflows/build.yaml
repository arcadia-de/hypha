name: Build Hypha
on:
  push:
    branches:
      - main
  release:
    types:
      - published
permissions:
  contents: write
  pull-requests: write
  packages: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
  compile:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ github.event_name == 'release' || needs.release-please.outputs.releases_created == 'true' }}
    container:
      image: ghcr.io/arcadia-de/hypha/hypha-build-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      - name: Check Environment Versions
        run: |
          go version
          meson --version
          ninja --version
      - name: Compile libhypha
        run: |
          meson setup build --reconfigure
          ninja -C build
      - name: Compile Hypha
        run: |
          export CGO_ENABLED=1
          export PKG_CONFIG_PATH="$(pwd)/build/meson-uninstalled:$PKG_CONFIG_PATH"
          go build -ldflags="-X main.Version=${{ needs.release-please.outputs.version }} -linkmode=external -s -w -extldflags=-Wl,--gc-sections" \
            -o hypha \
            cmd/hypha/main.go
      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.version }}
          files: hypha

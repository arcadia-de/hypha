services:
  build-env:
    image: ghcr.io/arcadia-de/hypha/hypha-build-env:latest
    build:
      context: .
      dockerfile: docker/build/Dockerfile
      args:
        UBUNTU_VERSION: 26.04
        GO_VERSION: 1.26.4
        GRAPHVIZ_VERSION: 16.0.0
        JANSSON_VERSION: 2.15.1
        LIBARCHIVE_VERSION: 3.8.8
        LIBGIT2_VERSION: 1.9.7
        LIBSODIUM_VERSION: 1.0.22
        LIBUV_VERSION: 1.52.1
        UTIL_LINUX_VERSION: 2.42.2
        WAMR_VERSION: 2.4.5
        XXHASH_VERSION: 0.8.3
        LUA_VERSION: 5.4.8
    profiles:
      - build-only
  sandbox:
    container_name: hypha-sandbox
    image: hypha-sandbox:latest
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile
      args:
        HYPHA_BUILDENV_VERSION: latest
        UBUNTU_VERSION: "26.04"
        GO_VERSION: "1.26.4"
    volumes:
      - .:/hypha
      - ./example-config:/root/.config/hypha
    tty: true
    stdin_open: true
